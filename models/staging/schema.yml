version: 2

sources:
  - name: staging
    database: project-c02f22a2-e03c-4345-a97
    schema: zoomcamp

    tables:
      - name: green_tripdata
      - name: yellow_tripdata

models:
  - name: stg_staging__green_tripdata
    description: "Modelo de staging para viajes de taxis verdes limpios y tipados"
    columns:
      - name: tripid
        data_type: string
        description: "Clave primaria compuesta (hash surrogate key)"
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

      - name: vendorid
        data_type: int64
        description: "ID del proveedor de taxímetro"

      - name: ratecodeid
        data_type: int64
        description: ""

      - name: pickup_locationid
        data_type: int64
        description: "ID de la zona de inicio del viaje"
        tests:
          - relationships:
              arguments:
                to: ref('taxi_zone_lookup')
                field: locationid
              config:
                severity: warn

      - name: dropoff_locationid
        data_type: int64
        description: "ID de la zona de fin del viaje"
        tests:
          - relationships:
              arguments:
                to: ref('taxi_zone_lookup')
                field: locationid
              config:
                severity: warn

      - name: pickup_datetime
        data_type: timestamp
        description: ""

      - name: dropoff_datetime
        data_type: timestamp
        description: ""

      - name: store_and_fwd_flag
        data_type: string
        description: ""

      - name: passenger_count
        data_type: int64
        description: ""

      - name: trip_distance
        data_type: numeric
        description: ""

      - name: trip_type
        data_type: int64
        description: ""

      - name: fare_amount
        data_type: numeric
        description: ""

      - name: extra
        data_type: numeric
        description: ""

      - name: mta_tax
        data_type: numeric
        description: ""

      - name: tip_amount
        data_type: numeric
        description: ""

      - name: tolls_amount
        data_type: numeric
        description: ""

      - name: ehail_fee
        data_type: numeric
        description: ""

      - name: improvement_surcharge
        data_type: numeric
        description: ""

      - name: total_amount
        data_type: numeric
        description: ""

      - name: payment_type
        data_type: int64
        description: "Código de método de pago"

      - name: payment_type_description
        data_type: string
        description: "Descripción textual del método de pago generada por macro"
        tests:
          - accepted_values:
              arguments:
                values: ['Credit card', 'Cash', 'No charge', 'Dispute', 'Unknown', 'Empty']
              config:
                severity: warn

      - name: congestion_surcharge
        data_type: numeric
        description: ""

